<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遊ぶ - プラットフォーマー</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/play.css">
</head>
<body class="play">
<header class="ptop">
  <h1 id="ptitle">読み込み中…</h1>
  <span class="spacer"></span>
  <button id="prestart" title="最初からやり直す (R)">▶ リスタート</button>
  <button id="peditor" title="エディタで開いて編集する(自分用のコピーとして追加されます)">エディタで開く</button>
</header>
<div id="pmsg" class="pmsg" role="status"></div>
<main class="pmain">
  <div class="stage" id="stage">
    <canvas id="cv" width="640" height="384"></canvas>
    <canvas id="cv3" class="off" width="640" height="384"></canvas>
    <canvas id="hud" width="640" height="384"></canvas>
  </div>
  <div id="pdrop" class="pdrop" hidden>
    <p><b>遊ぶゲームを選んでください</b></p>
    <p class="mute">プロジェクトファイル(.pfmk.json)または「画像で保存」したPNGを、この画面にドラッグ&ドロップするか、下から選びます。</p>
    <label class="btnlike">ファイルを選ぶ<input type="file" id="pfile" accept=".json,.pfmk,.png,image/png" hidden></label>
    <p class="mute">URL指定: <code>play.html?src=&lt;プロジェクトファイルのURL&gt;</code>(別のサイトに置く場合はCORSを許可する必要があります)</p>
  </div>
  <div class="pad"><button id="bl">◀</button><button id="bj">ジャンプ</button><button id="br">▶</button></div>
  <p class="mute vhint2">← → / A D で移動、Space / ↑ / W でジャンプ。コインを集めて旗を目指します。敵は上から踏むと倒せます。</p>
</main>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
<script type="module" src="js/play.js"></script>
</body>
</html>
